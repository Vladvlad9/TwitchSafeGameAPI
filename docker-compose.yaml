services:
  api:
    build:
      context: ./
    image: garage
    env_file: [ ./.env ]
    ports:
      - "9881:9881"
      - "4343:4343"
    environment:
      - PORT=9883
    volumes:
      - ./:/opt
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
